<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>截图</title>
  <style>
    * { margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; cursor: crosshair; }
    body { background: transparent; }
    #mask { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.25); }
    #rect {
      position: fixed; border: 2px solid #2f81f7; background: rgba(47, 129, 247, 0.08);
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.35); display: none; pointer-events: none;
    }
    #size {
      position: fixed; display: none; background: rgba(13, 17, 23, 0.9); color: #e6edf3;
      font: 12px/1.5 system-ui; padding: 2px 8px; border-radius: 6px; pointer-events: none; white-space: nowrap;
    }
    #hint {
      position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
      background: rgba(13, 17, 23, 0.85); color: #e6edf3; font: 13px/1.5 system-ui;
      padding: 6px 14px; border-radius: 999px; pointer-events: none; user-select: none;
    }
  </style>
</head>
<body>
  <div id="mask"></div>
  <div id="rect"></div>
  <div id="size"></div>
  <div id="hint">拖动框选截图区域，松开完成 · Esc 取消</div>
  <script>
    'use strict';
    const d = window.dshDesktop;
    const rect = document.getElementById('rect');
    const sizeEl = document.getElementById('size');
    let start = null;

    document.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      // 预热：拖选期间主进程并行捕获全屏，松手提交时零等待
      if (d && d.captureWarmup) { try { d.captureWarmup(); } catch { /* 忽略 */ } }
      start = { x: e.clientX, y: e.clientY };
      rect.style.display = 'block';
      sizeEl.style.display = 'block';
    });

    document.addEventListener('mousemove', (e) => {
      if (!start) return;
      const x = Math.min(start.x, e.clientX);
      const y = Math.min(start.y, e.clientY);
      const w = Math.abs(e.clientX - start.x);
      const h = Math.abs(e.clientY - start.y);
      rect.style.left = x + 'px';
      rect.style.top = y + 'px';
      rect.style.width = w + 'px';
      rect.style.height = h + 'px';
      sizeEl.style.left = x + 'px';
      sizeEl.style.top = Math.max(0, y - 24) + 'px';
      sizeEl.textContent = Math.round(w) + ' × ' + Math.round(h);
    });

    document.addEventListener('mouseup', (e) => {
      if (!start) return;
      const x = Math.min(start.x, e.clientX);
      const y = Math.min(start.y, e.clientY);
      const w = Math.abs(e.clientX - start.x);
      const h = Math.abs(e.clientY - start.y);
      start = null;
      if (w < 4 || h < 4) {
        if (d && d.cancelCapture) d.cancelCapture();
        else window.close();
        return;
      }
      if (d && d.submitRegion) {
        d.submitRegion({ x: Math.round(x), y: Math.round(y), width: Math.round(w), height: Math.round(h) });
      } else {
        window.close();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (d && d.cancelCapture) d.cancelCapture();
        else window.close();
      }
    });

    document.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      if (d && d.cancelCapture) d.cancelCapture();
      else window.close();
    });
  </script>
</body>
</html>
