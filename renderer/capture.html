<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>截图</title>
  <style>
    * { margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; cursor: crosshair; }
    body { background: #0d1117; }
    #stage {
      position: fixed; inset: 0;
      background-color: #0d1117;
      background-repeat: no-repeat;
      background-size: 100% 100%;
    }
    #rect {
      position: fixed; border: 2px solid #2f81f7; background: rgba(47, 129, 247, 0.08);
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.35); display: none; pointer-events: none;
    }
    #size {
      position: fixed; display: none; background: rgba(13, 17, 23, 0.9); color: #e6edf3;
      font: 12px/1.5 system-ui; padding: 2px 8px; border-radius: 6px; pointer-events: none; white-space: nowrap;
    }
    #hint {
      position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
      background: rgba(13, 17, 23, 0.85); color: #e6edf3; font: 13px/1.5 system-ui;
      padding: 6px 14px; border-radius: 999px; pointer-events: none; user-select: none;
    }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="rect"></div>
  <div id="size"></div>
  <div id="hint">正在捕获屏幕…</div>
  <script>
    'use strict';
    const d = window.dshDesktop;
    const stage = document.getElementById('stage');
    const rect = document.getElementById('rect');
    const sizeEl = document.getElementById('size');
    const hintEl = document.getElementById('hint');
    let start = null;
    const cdebug = (step, val) => {
      if (d && typeof d.clientDebug === 'function') {
        try { d.clientDebug({ src: 'capture-page', step, val }); } catch { /* 忽略 */ }
      }
    };

    function setBackdrop(dataUrl) {
      stage.style.backgroundImage = 'url("' + dataUrl + '")';
      hintEl.textContent = '拖动框选截图区域，松开完成 · Esc 取消';
      cdebug('backdrop-set', String(dataUrl).length);
    }
    function resetAll() {
      stage.style.backgroundImage = 'none';
      hintEl.textContent = '正在捕获屏幕…';
      rect.style.display = 'none';
      sizeEl.style.display = 'none';
      start = null;
      cdebug('reset', '');
    }

    // 冻结画面到达（主进程捕获完成后推送）
    if (d) {
      if (typeof d.onCaptureBackdrop === 'function') d.onCaptureBackdrop((ev) => { if (ev && ev.dataUrl) setBackdrop(ev.dataUrl); });
      if (typeof d.onCaptureReset === 'function') d.onCaptureReset(() => resetAll());
    }
    // 窗口每次隐藏时自清（含蓝色选框），下次打开绝不残留上一次的框选痕迹
    document.addEventListener('visibilitychange', () => {
      cdebug('vis', document.visibilityState);
      if (document.visibilityState === 'hidden') resetAll();
    });

    document.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      start = { x: e.clientX, y: e.clientY };
      rect.style.display = 'block';
      sizeEl.style.display = 'block';
    });

    document.addEventListener('mousemove', (e) => {
      if (!start) return;
      const x = Math.min(start.x, e.clientX);
      const y = Math.min(start.y, e.clientY);
      const w = Math.abs(e.clientX - start.x);
      const h = Math.abs(e.clientY - start.y);
      rect.style.left = x + 'px';
      rect.style.top = y + 'px';
      rect.style.width = w + 'px';
      rect.style.height = h + 'px';
      sizeEl.style.left = x + 'px';
      sizeEl.style.top = Math.max(0, y - 24) + 'px';
      sizeEl.textContent = Math.round(w) + ' × ' + Math.round(h);
    });

    document.addEventListener('mouseup', (e) => {
      if (!start) return;
      const x = Math.min(start.x, e.clientX);
      const y = Math.min(start.y, e.clientY);
      const w = Math.abs(e.clientX - start.x);
      const h = Math.abs(e.clientY - start.y);
      start = null;
      if (w < 4 || h < 4) {
        if (d && d.cancelCapture) d.cancelCapture();
        else window.close();
        return;
      }
      if (d && d.submitRegion) {
        d.submitRegion({ x: Math.round(x), y: Math.round(y), width: Math.round(w), height: Math.round(h) });
      } else {
        window.close();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (d && d.cancelCapture) d.cancelCapture();
        else window.close();
      }
    });

    document.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      if (d && d.cancelCapture) d.cancelCapture();
      else window.close();
    });
  </script>
</body>
</html>
