<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>终端模式 — DeepSeek Harness</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    background: #0d1117; color: #c9d1d9; font-family: Consolas, "Cascadia Mono", "Microsoft YaHei", monospace;
  }
  header {
    display: flex; align-items: center; gap: 10px; padding: 8px 14px;
    background: #161b22; border-bottom: 1px solid #21262d; font-size: 12px;
  }
  header .title { font-weight: 600; color: #e6edf3; }
  header .meta { color: #8b949e; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header button {
    background: transparent; color: #8b949e; border: 1px solid #30363d; border-radius: 6px;
    padding: 4px 10px; font-size: 12px; cursor: pointer; font-family: inherit;
    transition: color .15s, border-color .15s;
  }
  header button:hover { border-color: #4d5a6a; color: #e6edf3; }
  #out {
    flex: 1; overflow: auto; padding: 14px 16px; font-size: 13px; line-height: 1.55;
    white-space: pre-wrap; word-break: break-all;
  }
  footer {
    display: flex; gap: 10px; padding: 10px 14px; border-top: 1px solid #21262d; background: #161b22;
  }
  textarea {
    flex: 1; resize: none; height: 64px; background: #0d1117; color: #e6edf3;
    border: 1px solid #30363d; border-radius: 8px; padding: 8px 10px; font-size: 13px; font-family: inherit;
    transition: border-color .15s;
  }
  textarea:focus { outline: none; border-color: #58a6ff; }
  footer button {
    align-self: flex-end; padding: 8px 16px; border-radius: 8px; border: 1px solid transparent;
    background: #238636; color: #fff; font-size: 13px; cursor: pointer; font-family: inherit;
    transition: background .15s;
  }
  footer button:hover { background: #2ea043; }
  footer button:disabled { background: #21262d; color: #6e7681; cursor: not-allowed; }
  footer button#cancel { background: #b62324; }
  footer button#cancel:hover { background: #d1242f; }
  footer button#cancel:disabled { background: #21262d; }
  .hint { padding: 2px 14px 10px; color: #6e7681; font-size: 11px; }
</style>
</head>
<body>
<header>
  <span class="title">终端模式</span>
  <span class="meta" id="meta">dsh --profile headless</span>
  <button id="web">打开 Web 界面</button>
  <button id="cancel" disabled>取消运行</button>
</header>
<div id="out">每次运行 = 一个新会话：dsh --profile headless "任务"
结果会在这里流式输出。

</div>
<footer>
  <textarea id="input" placeholder="输入任务，回车运行；Shift+Enter 换行"></textarea>
  <button id="run">运行</button>
</footer>
<div class="hint">工作区：<span id="ws">—</span></div>
<script src="terminal.js"></script>
</body>
</html>
