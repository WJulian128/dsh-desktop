<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>快速命令</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
    .box {
      margin: 0 auto; width: 100%; max-width: 660px; margin-top: 18vh;
      background: #161b22; border: 1px solid #30363d; border-radius: 14px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, .5); padding: 12px 16px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .row { display: flex; align-items: center; gap: 10px; }
    .glyph { width: 18px; height: 18px; opacity: .85; display: block; flex: none; }
    input {
      flex: 1; background: transparent; border: none; outline: none;
      color: #e6edf3; font: 15px/1.4 system-ui, "Segoe UI", sans-serif;
    }
    input::placeholder { color: #6e7681; }
    .hint { color: #6e7681; font: 12px/1.5 system-ui; text-align: right; }
    kbd { background: #21262d; border: 1px solid #30363d; border-radius: 4px; padding: 1px 5px; font: 11px/1.4 system-ui; color: #c9d1d9; }
  </style>
</head>
<body>
  <div class="box">
    <div class="row">
      <img class="glyph" src="icon.png" alt="">
      <input id="cmd" type="text" placeholder="输入任务，回车直接交给 harness…" autocomplete="off" />
    </div>
    <div class="hint"><kbd>Enter</kbd> 交给 harness · <kbd>Esc</kbd> 取消 · <kbd>Ctrl+Enter</kbd> 只粘贴不发送</div>
  </div>
  <script>
    'use strict';
    const d = window.dshDesktop;
    const input = document.getElementById('cmd');

    function hide() { if (d && d.quickCancel) d.quickCancel(); else window.close(); }

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { hide(); return; }
      if (e.key === 'Enter') {
        const text = input.value.trim();
        if (!text) { hide(); return; }
        if (d && d.quickSubmit) d.quickSubmit({ text, send: !e.ctrlKey });
        else window.close();
        input.value = '';
        return;
      }
    });

    input.focus();
    document.addEventListener('mousedown', (e) => {
      if (e.target !== input) hide();
    });
  </script>
</body>
</html>
